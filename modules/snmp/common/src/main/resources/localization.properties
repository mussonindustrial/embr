config.Connectivity.Address.Label=Address *
config.Connectivity.Address.Description=<br>The format of the SNMP connect URL is:<br><code><b>type</b>:<b>address</b></code><br>With the two parameters (in bold)<ul style=list-style-type:none;margin-left:10px><li><b>type</b>: The transport protocol used for SNMP communication. Allowed values include <code>udp</code>, <code>tcp</code>, <code>tls</code>, <code>dtls</code>, and <code>unix</code>.<li><b>address</b>: The type-specific target network address, which typically includes the host name or IP address and an optional port number. For <code>udp</code> and <code>tcp</code> connection types, the address is of the form <code><b>hostname</b>/<b>port</b></code>.</ul><p>Example: <code>udp:127.0.0.1/161</code>
config.Connectivity.Timeout.Label=Timeout *
config.Connectivity.Timeout.Description=Maximum amount of time to wait for a response in milliseconds.
config.Healthcheck.Frequency.Label=Healthcheck Frequency *
config.Healthcheck.Frequency.Description=The time in milliseconds between connection validation checks. If zero or negative, healthchecks will not be performed.
config.Healthcheck.Oid.Label=Healthcheck OID *
config.Healthcheck.Oid.Description=This OID will be queried to validate the connection. If empty, healthchecks will not be performed.
config.Community.ReadCommunity.Label=Read Community *
config.Community.ReadCommunity.Description=The SNMP community used for reads.
config.Community.WriteCommunity.Label=Write Community *
config.Community.WriteCommunity.Description=The SNMP community used for writes. If empty, writing to the device will disabled.

config.Authentication.Username.Label=Username *
