config.Connectivity.Address.Label=Address *
config.Connectivity.Address.Description=SNMP connect URL formatted as "type:address". "type" is the transport protocol used for SNMP communication. Allowed values include "udp", "tcp", "tls", "dtls", and "unix". "address" is the type-specific target network address, which typically includes the host name or IP address and an optional port number. Example: "udp:127.0.0.1/161"
config.Connectivity.Timeout.Label=Timeout *
config.Connectivity.Timeout.Description=Maximum amount of time to wait for a response in milliseconds.
config.Healthcheck.Frequency.Label=Healthcheck Frequency *
config.Healthcheck.Frequency.Description=The time in milliseconds between connection validation checks. If zero or negative, healthchecks will not be performed.
config.Healthcheck.Oid.Label=Healthcheck OID *
config.Healthcheck.Oid.Description=This OID will be queried to validate the connection. If empty, healthchecks will not be performed.
config.Community.ReadCommunity.Label=Read Community *
config.Community.ReadCommunity.Description=The SNMP community used for reads.
config.Community.WriteCommunity.Label=Write Community *
config.Community.WriteCommunity.Description=The SNMP community used for writes. If empty, writing to the device will disabled.

config.Authentication.Username.Label=Username *
config.Authentication.Username.Description=Username used for authentication.
config.Authentication.AuthProtocol.Label=Authentication Protocol *
config.Authentication.AuthProtocol.Description=Protocol used for authentication.
config.Authentication.AuthPassword.Label=Authentication Password *
config.Authentication.AuthPassword.Description=Password used for authentication.
config.Authentication.PrivacyProtocol.Label=Privacy Protocol *
config.Authentication.PrivacyProtocol.Description=Protocol used for privacy.
config.Authentication.PrivacyPassword.Label=Privacy Password *
config.Authentication.PrivacyPassword.Description=Password used for privacy.