config.Authentication.AuthPassword.Description=Password used for authentication.
config.Authentication.PrivacyProtocol.Label=Privacy Protocol *
config.Authentication.PrivacyProtocol.Description=Protocol used for privacy.
config.Authentication.PrivacyPassword.Label=Privacy Password *
config.Authentication.PrivacyPassword.Description=Password used for privacy.