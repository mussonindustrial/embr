common-param.agent=SNMP agent name

readAsync.desc=Asynchronously reads the value of the OIDs from the given agent.
readAsync.param.oids=A list of OIDs to read from.
readAsync.returns=A PyCompletableFuture completed with a list of qualified values corresponding to the requested OIDs.

readBlocking.desc=Reads the value of the OIDs from the given agent.
readBlocking.param.oids=A list of OIDs to read from.
readBlocking.returns=A list of qualified values corresponding to the requested OIDs.

writeAsync.desc=Asynchronously writes values to the specified OIDs on the given agent.
writeAsync.param.oids=A list of OIDs to write to.
writeAsync.param.values=A list of values to write, corresponding one-to-one with the provided OIDs.
writeAsync.returns=A PyCompletableFuture completed with a list of QualityCodes indicating the result of each write operation.

writeBlocking.desc=Writes values to the specified OIDs on the given agent.
writeBlocking.param.oids=A list of OIDs to write to.
writeBlocking.param.values=A list of values to write, corresponding one-to-one with the provided OIDs.
writeBlocking.returns=A list of QualityCodes indicating the result of each write operation.

walkAsync.desc=Asynchronously walks the SNMP tree starting at the given OIDs on the specified agent.
walkAsync.param.oids=A list of root OIDs to walk.
walkAsync.returns=A PyCompletableFuture completed with a list of qualified values discovered during the walk operation.

walkBlocking.desc=Walks the SNMP tree starting at the given OIDs on the specified agent.
walkBlocking.param.oids=A list of root OIDs to walk.
walkBlocking.returns=A list of qualified values discovered during the walk operation.

readTableAsync.desc=Asynchronously reads an SNMP table from the given agent and returns the results as a Dataset.
readTableAsync.param.columns=A list of column OIDs that define the table structure.
readTableAsync.param.lowerBoundIndex=The inclusive lower index bound for the table read.
readTableAsync.param.lowerBoundIndex.optional=true
readTableAsync.param.upperBoundIndex=The inclusive upper index bound for the table read.
readTableAsync.param.upperBoundIndex.optional=true
readTableAsync.returns=A PyCompletableFuture completed with a Dataset containing the table rows and columns derived from the SNMP response.

readTableBlocking.desc=Reads an SNMP table from the given agent and returns the results as a Dataset.
readTableBlocking.param.columns=A list of column OIDs that define the table structure.
readTableBlocking.param.lowerBoundIndex=The inclusive lower index bound for the table read.
readTableBlocking.param.lowerBoundIndex.optional=true
readTableBlocking.param.upperBoundIndex=The inclusive upper index bound for the table read.
readTableBlocking.param.upperBoundIndex.optional=true
readTableBlocking.returns=A Dataset containing the table rows and columns derived from the SNMP response.