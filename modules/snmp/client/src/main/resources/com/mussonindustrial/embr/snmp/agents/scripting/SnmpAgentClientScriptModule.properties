common-param.agent=SNMP agent name

read.desc=Reads the value of the OIDs from the given agent.
read.param.oids=A list of OIDs to read from.
read.returns=A list of qualified values corresponding to the requested OIDs.

write.desc=Writes values to the specified OIDs on the given agent.
write.param.oids=A list of OIDs to write to.
write.param.values=A list of values to write, corresponding one-to-one with the provided OIDs.
write.returns=A list of QualityCodes indicating the result of each write operation.

walk.desc=Walks the SNMP tree starting at the given OIDs on the specified agent.
walk.param.oids=A list of root OIDs to walk.
walk.returns=A list of qualified values discovered during the walk operation.

readTable.desc=Reads an SNMP table from the given agent and returns the results as a Dataset.
readTable.param.columns=A list of column OIDs that define the table structure.
readTable.param.lowerBoundIndex=(Optional) The inclusive lower index bound for the table read.
readTable.param.upperBoundIndex=(Optional) The inclusive upper index bound for the table read.
readTable.returns=A Dataset containing the table rows and columns derived from the SNMP response.