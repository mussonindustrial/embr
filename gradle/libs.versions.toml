[versions]
allure-gradle = "3.0.0"
ia-gson = "2.10.1"
if97 = "2.0.0"
ignition-module = "0.4.1"
ignition-sdk = "8.3.0-beta1"
imagecomparison = "4.4.0"
java = "21"
jetty = "12.0.7"
kotlin = "2.1.21"
kotest = "6.0.0"
node-gradle = "7.1.0"
playwright = "1.55.0"
spotless = "7.0.4"
testcontainers-core = "1.21.3"
testcontainers-ignition = "0.4.3"

[plugins]
allure = { id = "io.qameta.allure", version.ref = "allure-gradle" }
ignition-module = { id = "io.ia.sdk.modl", version.ref = "ignition-module" }
kotest = { id = "io.kotest", version.ref = "kotest"}
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
node-gradle = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
if97 = { group = "com.hummeling", name = "if97", version.ref = "if97"}
ignition-common = { group = "com.inductiveautomation.ignitionsdk", name = "ignition-common", version.ref = "ignition-sdk" }
ignition-gson = { group = "com.inductiveautomation.ignition", name = "ia-gson", version.ref = "ia-gson"}
ignition-client-api = { group = "com.inductiveautomation.ignitionsdk", name = "client-api", version.ref = "ignition-sdk" }
ignition-designer-api = { group = "com.inductiveautomation.ignitionsdk", name = "designer-api", version.ref = "ignition-sdk" }
ignition-gateway-api = { group = "com.inductiveautomation.ignitionsdk", name = "gateway-api", version.ref = "ignition-sdk" }
ignition-vision-client-api = { group = "com.inductiveautomation.ignitionsdk", name = "vision-client-api", version.ref = "ignition-sdk" }
ignition-perspective-common = { group = "com.inductiveautomation.ignitionsdk", name = "perspective-common", version.ref = "ignition-sdk" }
ignition-perspective-designer = { group = "com.inductiveautomation.ignitionsdk", name = "perspective-designer", version.ref = "ignition-sdk" }
ignition-perspective-gateway = { group = "com.inductiveautomation.ignitionsdk", name = "perspective-gateway", version.ref = "ignition-sdk" }
jetty-server = { group = "org.eclipse.jetty", name = "jetty-server", version.ref = "jetty" }
jetty-servlet = { group = "org.eclipse.jetty.ee10", name = "jetty-ee10-servlet", version.ref = "jetty" }
jetty-servlets = { group = "org.eclipse.jetty.ee10", name = "jetty-ee10-servlets", version.ref = "jetty" }

# test framework
imagecomparison = { group = "com.github.romankh3", name = "image-comparison", version.ref = "imagecomparison"}
kotest-assertions-core = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
kotest-junit = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest" }
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }
kotest-testcontainers = { group = "io.kotest", name = "kotest-extensions-testcontainers", version.ref = "kotest" }
playwright = { group = "com.microsoft.playwright", name = "playwright", version.ref = "playwright"}
testcontainers-core = { group = "org.testcontainers", name = "testcontainers", version.ref = "testcontainers-core" }
testcontainers-ignition = { group = "com.mussonindustrial", name = "testcontainers-ignition", version.ref = "testcontainers-ignition" }

[bundles]
common = [
    "ignition-gson",
    "ignition-common"
]
gateway = [
    "ignition-gson",
    "ignition-common",
    "ignition-gateway-api",
    "jetty-server",
    "jetty-servlet"
]
designer = [
    "ignition-gson",
    "ignition-common",
    "ignition-designer-api",
]
client = [
    "ignition-common",
    "ignition-client-api",
    "ignition-vision-client-api",
]
perspectiveCommon = [
    "ignition-gson",
    "ignition-common",
    "ignition-perspective-common",
]
perspectiveDesigner = [
    "ignition-gson",
    "ignition-common",
    "ignition-designer-api",
    "ignition-perspective-common",
    "ignition-perspective-designer",
]
perspectiveGateway = [
    "ignition-gson",
    "ignition-common",
    "ignition-gateway-api",
    "ignition-perspective-common",
    "ignition-perspective-gateway",
]
kotest = [
    "kotest-assertions-core",
    "kotest-junit",
    "kotest-property",
    "kotest-testcontainers"
]
testcontainers = [
    "testcontainers-core",
    "testcontainers-ignition"
]